[project]
name = "daoyu"
version = "0.1.0"
description = "把微信变成 Claude Code 的遥控器"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=42"]

[project.scripts]
daoyu = "gateway.app:start"
daoyu-login = "gateway.login:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aioresponses>=0.7"]
qr = ["qrcode[pil]>=7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "gateway", "worker"]
